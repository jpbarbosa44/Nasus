[package]
name = "nasus"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Curador das suas leituras: app de terminal e bot de Telegram para gerenciar livros, planos de leitura e metas"
license = "GPL-3.0-or-later"
repository = "https://github.com/jpbarbosa44/Nasus"

[profile.release]
strip = true
lto = true

[dependencies]
anyhow = "1"
chrono = "0.4"
directories = "6"
ratatui = "0.29"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
