<!doctype html>
<!-- Página única da interface web do Nasus. Sem frameworks: HTML, CSS e JS
     puros, conversando com a API JSON de src/web/mod.rs. O visual e os
     atalhos espelham a TUI — mesmas telas, mesmas cores, mesmas teclas. -->
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nasus — curador das suas leituras</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M8 20h38q4 0 4 4v62q0-4-4-4H8zM92 20H54q-4 0-4 4v62q0-4 4-4h38z' fill='%234dd8e6'/></svg>">
  <style>
    :root {
      --bg: #0e1014;
      --painel: #12151b;
      --painel2: #171b23;
      --borda: #232a35;
      --borda-forte: #2f3847;
      --fg: #d8dee4;
      --dim: #6c7380;
      --sel: #1b2a38;
      --cy: #4dd8e6;
      --ok: #7ace7a;
      --err: #ee6a6a;
      --amar: #e6c84d;
      --cinza: #a3abb5;
      --gutter: clamp(16px, 2.6vw, 48px);
      --r: 8px;
      --r-sm: 6px;
      --sombra: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 30px rgba(0, 0, 0, .22);
      --tempo: .14s ease;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1100px 520px at 78% -8%, #131923 0%, transparent 60%), var(--bg);
      color: var(--fg);
      font: 14px/1.55 ui-monospace, "JetBrains Mono", "Fira Mono", Consolas, monospace;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--sel); }
    * { scrollbar-width: thin; scrollbar-color: var(--borda-forte) transparent; }

    a { color: var(--cy); }
    button, input, select, textarea { font: inherit; color: inherit; }

    .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }

    /* ── menu lateral ─────────────────────────────── */
    nav {
      border-right: 1px solid var(--borda);
      background: var(--painel);
      padding: 22px 14px;
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
    }
    .marca { display: flex; gap: 10px; align-items: center; padding: 0 8px 18px; }
    .marca svg { flex: none; }
    .marca b { color: var(--cy); letter-spacing: .32em; font-size: 17px; }
    .marca small { display: block; color: var(--dim); font-size: 11px; letter-spacing: 0; }
    nav ol { list-style: none; margin: 0; padding: 0; }
    nav li button {
      width: 100%; display: flex; align-items: baseline; gap: 10px;
      background: none; border: 0; border-radius: var(--r-sm);
      padding: 8px 10px; text-align: left; cursor: pointer; transition: background var(--tempo);
    }
    nav li button:hover { background: var(--painel2); }
    nav li button.ativo { background: var(--sel); color: var(--cy); }
    nav .num { color: var(--dim); width: 1ch; }
    nav .cont { margin-left: auto; color: var(--dim); font-size: 12px; }
    nav .rodape { color: var(--dim); font-size: 11px; padding: 18px 10px 0; }

    main { padding: 26px var(--gutter) 60px; min-width: 0; }
    h1 { font-size: 18px; margin: 0 0 16px; color: var(--cy); font-weight: 600; }
    h1 .migalha { color: var(--dim); font-weight: 400; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 26px 0 10px; font-weight: 500; }

    .painel { background: var(--painel); border: 1px solid var(--borda); border-radius: var(--r); padding: 16px 18px; }

    /* ── botões, campos ───────────────────────────── */
    a.btn { text-decoration: none; color: inherit; display: inline-block; }
    .btn {
      background: var(--painel2); border: 1px solid var(--borda-forte); border-radius: var(--r-sm);
      padding: 6px 12px; cursor: pointer; transition: border-color var(--tempo), background var(--tempo); white-space: nowrap;
    }
    .btn:hover { border-color: var(--cy); }
    .btn.prim { background: var(--cy); color: #071316; border-color: var(--cy); font-weight: 600; }
    .btn.perigo:hover { border-color: var(--err); color: var(--err); }
    .btn kbd { color: var(--dim); margin-left: 6px; font-size: 11px; }
    .btn.prim kbd { color: #0b3940; }
    .acoes { display: flex; flex-wrap: wrap; gap: 8px; }

    input[type=text], input[type=number], input:not([type]), textarea, select {
      background: var(--bg); border: 1px solid var(--borda-forte); border-radius: var(--r-sm);
      padding: 7px 10px; width: 100%; outline: none; transition: border-color var(--tempo);
    }
    input:focus, textarea:focus, select:focus { border-color: var(--cy); }
    textarea { resize: vertical; min-height: 70px; }
    label { display: block; color: var(--dim); font-size: 12px; margin: 10px 0 4px; }
    .dica { color: var(--dim); font-size: 12px; margin-top: 4px; }

    /* ── biblioteca ───────────────────────────────── */
    .abas { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--borda); margin-bottom: 14px; }
    .abas button {
      background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--dim);
    }
    .abas button.ativo { color: var(--cy); border-bottom-color: var(--cy); }
    .barra-ferr { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .barra-ferr .filtro { flex: 1 1 220px; max-width: 360px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .chip {
      border: 1px solid var(--borda-forte); background: none; border-radius: 99px; padding: 2px 10px;
      font-size: 12px; cursor: pointer; color: var(--cinza);
    }
    .chip.ativo { border-color: var(--amar); color: var(--amar); }
    .chip small { color: var(--dim); }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; color: var(--dim); font-weight: 400; font-size: 12px; padding: 6px 10px; border-bottom: 1px solid var(--borda); }
    td { padding: 8px 10px; border-bottom: 1px solid var(--borda); vertical-align: middle; }
    tbody tr { cursor: pointer; transition: background var(--tempo); }
    tbody tr:hover { background: var(--painel2); }
    tbody tr.sel { background: var(--sel); }
    td.dim, .dim { color: var(--dim); }
    td.titulo { font-weight: 500; }
    .vazio { color: var(--dim); padding: 30px 10px; text-align: center; }

    .progresso { display: flex; align-items: center; gap: 8px; min-width: 120px; }
    .progresso .trilho { flex: 1; height: 6px; background: var(--borda); border-radius: 3px; overflow: hidden; }
    .progresso .cheio { height: 100%; background: var(--cy); }
    .progresso span { font-size: 12px; color: var(--dim); width: 4ch; text-align: right; }
    .estrelas { color: var(--amar); letter-spacing: 1px; }

    .st-shelf { color: var(--cinza); }
    .st-reading { color: var(--cy); }
    .st-want { color: #fff; }
    .st-read { color: var(--ok); }
    .st-abandoned { color: var(--err); }

    /* ── detalhe ──────────────────────────────────── */
    .detalhe { display: grid; grid-template-columns: 150px 1fr; gap: 24px; align-items: start; }
    .capa {
      width: 150px; aspect-ratio: 2 / 3; border-radius: var(--r-sm); background: var(--painel2) center / cover;
      border: 1px solid var(--borda); display: grid; place-items: center; color: var(--dim); font-size: 40px; overflow: hidden;
    }
    .capa img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .info h1 { margin-bottom: 2px; }
    .info .autor { color: var(--dim); margin-bottom: 14px; }
    .campos { display: grid; grid-template-columns: max-content 1fr; gap: 4px 18px; margin-bottom: 14px; }
    .campos dt { color: var(--dim); }
    .campos dd { margin: 0; }
    .estrelas-btn button { background: none; border: 0; color: var(--borda-forte); font-size: 18px; cursor: pointer; padding: 0 1px; }
    .estrelas-btn button.on { color: var(--amar); }
    .status-btns { display: flex; flex-wrap: wrap; gap: 6px; }
    .status-btns button { background: none; border: 1px solid var(--borda-forte); border-radius: 99px; padding: 2px 10px; cursor: pointer; }
    .status-btns button.ativo { background: var(--sel); border-color: currentColor; }
    .pagina-form { display: flex; gap: 8px; align-items: center; max-width: 360px; }
    .pagina-form input { width: 110px; }

    .notas { list-style: none; margin: 0; padding: 0; }
    .notas li { padding: 10px 0; border-bottom: 1px solid var(--borda); display: flex; gap: 12px; align-items: flex-start; }
    .notas .pg { color: var(--dim); min-width: 5ch; }
    .notas .corpo { flex: 1; white-space: pre-wrap; }
    .notas .citacao { font-style: italic; color: #e8ecf0; }
    .notas .citacao::before { content: "“"; color: var(--cy); }
    .notas .citacao::after { content: "”"; color: var(--cy); }
    .notas .x { background: none; border: 0; color: var(--dim); cursor: pointer; }
    .notas .x:hover { color: var(--err); }
    .nova-nota { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; margin-top: 12px; align-items: start; }
    .nova-nota select { width: auto; }

    .calor { display: grid; grid-template-rows: repeat(7, 11px); grid-auto-flow: column; grid-auto-columns: 11px; gap: 3px; overflow-x: auto; padding: 10px 0 4px; }
    .calor i { border-radius: 2px; background: var(--borda); }
    .calor i.vazio { background: none; }
    .calor i.n1 { background: color-mix(in srgb, var(--cy) 30%, var(--borda)); }
    .calor i.n2 { background: color-mix(in srgb, var(--cy) 55%, var(--borda)); }
    .calor i.n3 { background: color-mix(in srgb, var(--cy) 80%, var(--borda)); }
    .calor i.n4 { background: var(--cy); }
    .ritmo { color: var(--cy); }
    .emp { color: var(--amar); }
    .plano-linha { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
    .plano-linha > div { width: 150px; }
    .situacao { margin-top: 8px; }

    /* ── estatísticas ─────────────────────────────── */
    .numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .numeros .painel b { display: block; font-size: 24px; color: var(--cy); font-weight: 600; }
    .numeros .painel span { color: var(--dim); font-size: 12px; }
    .meta-trilho { height: 10px; background: var(--borda); border-radius: 5px; overflow: hidden; margin: 8px 0 4px; }
    .meta-trilho div { height: 100%; background: var(--cy); }
    .meses { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; align-items: end; height: 160px; }
    .meses .col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
    .meses .bar { width: 100%; max-width: 34px; background: var(--cy); border-radius: 3px 3px 0 0; min-height: 2px; }
    .meses .bar.zero { background: var(--borda); }
    .meses small { color: var(--dim); font-size: 11px; }
    .meses .v { font-size: 11px; color: var(--fg); }
    .cats li { display: grid; grid-template-columns: 16ch 1fr 3ch; gap: 10px; align-items: center; padding: 3px 0; }
    .cats { list-style: none; padding: 0; margin: 0; }
    .cats .b { height: 8px; background: var(--cy); border-radius: 4px; }

    /* ── busca ────────────────────────────────────── */
    .busca-form { display: flex; gap: 8px; max-width: 640px; flex-wrap: wrap; }
    .busca-form input { flex: 1 1 260px; }
    .resultados { list-style: none; padding: 0; margin: 16px 0 0; max-width: 820px; }
    .resultados li { display: flex; gap: 14px; align-items: center; padding: 10px 12px; border: 1px solid var(--borda); border-radius: var(--r-sm); margin-bottom: 8px; background: var(--painel); }
    .resultados li.sel { border-color: var(--cy); }
    .resultados .txt { flex: 1; min-width: 0; }
    .resultados .txt b { display: block; }
    .badge { font-size: 11px; border: 1px solid var(--ok); color: var(--ok); border-radius: 99px; padding: 1px 8px; }

    .atalhos { display: grid; grid-template-columns: max-content 1fr; gap: 6px 22px; }
    .atalhos dt { color: var(--cy); }
    .atalhos dd { margin: 0; }
    kbd { border: 1px solid var(--borda-forte); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 12px; }

    /* ── modal e aviso ────────────────────────────── */
    .fundo { position: fixed; inset: 0; background: rgba(5, 7, 10, .66); display: grid; place-items: center; padding: 16px; z-index: 10; }
    .modal { background: var(--painel); border: 1px solid var(--cy); border-radius: var(--r); padding: 20px 22px; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; box-shadow: var(--sombra); }
    .modal h3 { margin: 0 0 6px; color: var(--cy); font-size: 15px; }
    .modal .rodape { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .grade2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .aviso { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--painel2); border: 1px solid var(--ok); color: var(--ok); padding: 8px 16px; border-radius: var(--r-sm); box-shadow: var(--sombra); z-index: 20; max-width: calc(100vw - 32px); }
    .aviso.erro { border-color: var(--err); color: var(--err); }
    [hidden] { display: none !important; }

    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }
      nav { position: static; height: auto; padding: 12px; border-right: 0; border-bottom: 1px solid var(--borda); }
      .marca { padding-bottom: 10px; }
      nav ol { display: flex; overflow-x: auto; gap: 4px; }
      nav li button { white-space: nowrap; }
      nav .num, nav .rodape { display: none; }
      .col-autor, .col-cat, .col-nota { display: none; }
      .detalhe { grid-template-columns: 1fr; }
      .capa { width: 110px; }
      .grade2 { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="app">
    <nav>
      <div class="marca">
        <svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true"><path d="M8 20h38q4 0 4 4v62q0-4-4-4H8zM92 20H54q-4 0-4 4v62q0-4 4-4h38z" fill="#4dd8e6"/></svg>
        <div><b>NASUS</b><small>curador das suas leituras</small></div>
      </div>
      <ol id="menu"></ol>
      <div class="rodape">teclas <kbd>1</kbd>–<kbd>7</kbd> trocam de tela · <kbd>?</kbd> ajuda</div>
    </nav>
    <main id="tela"></main>
  </div>
  <div id="modal"></div>
  <div id="aviso" class="aviso" hidden></div>

  <script>
    "use strict";

    // ── estado ─────────────────────────────────────
    const MENU = [
      { nome: "Biblioteca", aba: "todos" },
      { nome: "Estante", aba: "shelf" },
      { nome: "Quero ler", aba: "want" },
      { nome: "Lendo agora", aba: "reading" },
      { nome: "Estatísticas", tela: "stats" },
      { nome: "Buscar online", tela: "busca" },
      { nome: "Como usar", tela: "ajuda" },
    ];
    const ABAS = ["todos", "shelf", "reading", "want", "read", "abandoned"];
    const MESES = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];

    const e = {
      tela: "biblioteca", aba: "todos", filtro: "", categoria: null, sel: 0,
      livros: [], status: [], categorias: [],
      detalhe: null, // { livro, notas, plano }
      ano: new Date().getFullYear(), stats: null,
      busca: "", resultados: [], buscaSel: 0, buscando: false, isbnFoto: null,
    };

    // ── utilidades ─────────────────────────────────
    const $ = (s, r = document) => r.querySelector(s);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const statusDe = (chave) => e.status.find((s) => s.chave === chave) || { chave, nome: chave, rotulo: chave, simbolo: "?" };
    const estrelas = (n) => (n ? "★".repeat(n) + "☆".repeat(5 - n) : "");
    const capaUrl = (isbn) => `https://covers.openlibrary.org/b/isbn/${encodeURIComponent(isbn)}-M.jpg?default=false`;
    const plural = (n, p) => `${n} ${p}${n === 1 ? "" : "s"}`;

    async function api(metodo, caminho, corpo) {
      const op = { method: metodo, headers: {} };
      if (corpo instanceof Blob) op.body = corpo;
      else if (corpo !== undefined) { op.body = JSON.stringify(corpo); op.headers["Content-Type"] = "application/json"; }
      const r = await fetch(caminho, op);
      const v = await r.json().catch(() => ({ erro: `erro ${r.status}` }));
      if (!r.ok) throw new Error(v.erro || `erro ${r.status}`);
      return v;
    }

    let timerAviso;
    function avisar(texto, erro = false) {
      const a = $("#aviso");
      a.textContent = texto;
      a.className = "aviso" + (erro ? " erro" : "");
      a.hidden = false;
      clearTimeout(timerAviso);
      timerAviso = setTimeout(() => (a.hidden = true), erro ? 5000 : 2600);
    }
    // tenta: executa uma ação e mostra o erro em vez de deixar a página quieta
    const tenta = (f) => async (...a) => { try { await f(...a); } catch (err) { avisar(err.message, true); } };

    async function carregarLivros() {
      const v = await api("GET", "/api/livros");
      e.livros = v.livros;
      e.status = v.status;
      e.categorias = (await api("GET", "/api/categorias")).categorias;
      e.series = (await api("GET", "/api/series")).series;
    }

    // filtro especial no lugar de uma categoria
    const EMPRESTADOS = "↗ emprestados";

    function visiveis() {
      const f = e.filtro.toLowerCase();
      return e.livros.filter((b) =>
        (e.aba === "todos" || b.status === e.aba) &&
        (!e.categoria || (e.categoria === EMPRESTADOS ? !!b.emprestado : b.categorias.includes(e.categoria))) &&
        (!f || b.titulo.toLowerCase().includes(f) || b.autor.toLowerCase().includes(f) || b.categorias.some((c) => c.includes(f)) ||
          b.serie.toLowerCase().includes(f) || (b.emprestado && b.emprestado.pessoa.toLowerCase().includes(f))));
    }
    const contagem = (aba) => e.livros.filter((b) => aba === "todos" || b.status === aba).length;

    // ── menu ───────────────────────────────────────
    function itemAtivo() {
      if (e.tela === "biblioteca" || e.tela === "detalhe") return MENU.findIndex((m) => m.aba === e.aba);
      return MENU.findIndex((m) => m.tela === e.tela);
    }
    function desenharMenu() {
      const ativo = itemAtivo();
      $("#menu").innerHTML = MENU.map((m, i) => `
        <li><button data-menu="${i}" class="${i === ativo ? "ativo" : ""}">
          <span class="num">${i + 1}</span>${esc(m.nome)}
          ${m.aba ? `<span class="cont">${contagem(m.aba)}</span>` : ""}
        </button></li>`).join("");
    }
    const irMenu = tenta(async (i) => {
      const m = MENU[i];
      if (!m) return;
      if (m.aba) { e.aba = m.aba; e.sel = 0; e.tela = "biblioteca"; await carregarLivros(); }
      else if (m.tela === "stats") await abrirStats(e.ano);
      else e.tela = m.tela;
      desenhar();
      if (m.tela === "busca") $("#q")?.focus();
    });

    // ── telas ──────────────────────────────────────
    // o endereço guarda a tela (#livro/3, #stats...): recarregar e o "voltar"
    // do navegador funcionam
    function hashAtual() {
      if (e.tela === "detalhe") return `#livro/${e.detalhe.livro.id}`;
      if (e.tela === "biblioteca") return e.aba === "todos" ? "#" : `#${e.aba}`;
      return `#${e.tela}`;
    }
    async function seguirHash() {
      const h = location.hash.slice(1);
      const livro = h.match(/^livro\/(\d+)$/);
      if (livro) {
        e.detalhe = await api("GET", `/api/livro?id=${livro[1]}`);
        e.tela = "detalhe";
      } else if (h === "stats") await abrirStats(e.ano);
      else if (h === "busca" || h === "ajuda") e.tela = h;
      else {
        e.tela = "biblioteca";
        e.aba = ABAS.includes(h) ? h : "todos";
        await carregarLivros();
      }
    }
    window.addEventListener("hashchange", tenta(async () => {
      if (location.hash === hashAtual() || (location.hash === "" && hashAtual() === "#")) return;
      await seguirHash();
      desenhar();
    }));

    function desenhar() {
      if (hashAtual() !== (location.hash || "#")) history.pushState(null, "", hashAtual() === "#" ? location.pathname : hashAtual());
      desenharMenu();
      const t = $("#tela");
      if (e.tela === "biblioteca") t.innerHTML = telaBiblioteca();
      else if (e.tela === "detalhe") t.innerHTML = telaDetalhe();
      else if (e.tela === "stats") t.innerHTML = telaStats();
      else if (e.tela === "busca") t.innerHTML = telaBusca();
      else t.innerHTML = telaAjuda();
    }

    function barra(p) {
      if (p == null) return `<span class="dim">—</span>`;
      const pct = Math.round(p * 100);
      return `<div class="progresso"><div class="trilho"><div class="cheio" style="width:${pct}%"></div></div><span>${pct}%</span></div>`;
    }

    function telaBiblioteca() {
      const lista = visiveis();
      e.sel = Math.min(e.sel, Math.max(0, lista.length - 1));
      const abas = ABAS.map((a) => {
        const rot = a === "todos" ? "Todos" : statusDe(a).rotulo;

    // mapaCalor desenha as páginas por dia do último ano, uma coluna por semana
    function mapaCalor(l) {
      const porDia = new Map(l.dias);
      const maior = Math.max(1, ...l.dias.map((d) => d[1]));
      const dia = (s) => new Date(s + "T12:00:00");
      const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      const desde = dia(l.desde), hoje = dia(l.hoje);
      const d = new Date(desde);
      d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); // volta até a segunda-feira
      let cels = "";
      for (; d <= hoje; d.setDate(d.getDate() + 1)) {
        if (d < desde) { cels += `<i class="vazio"></i>`; continue; }
        const n = porDia.get(iso(d)) || 0;
        const nivel = n ? 1 + Math.min(3, Math.floor((n * 4) / (maior + 1))) : 0;
        cels += `<i class="n${nivel}" title="${d.toLocaleDateString("pt-BR")}: ${plural(n, "página")}"></i>`;
      }
      const s = l.sequencia;
      const seq = s.atual
        ? `🔥 <b>${plural(s.atual, "dia")}</b> seguidos${s.leu_hoje ? "" : ` <span style="color:var(--amar)">· leia hoje para não perder</span>`}`
        : `<span class="dim">nenhuma sequência agora</span>`;
      return `<div class="seq">${seq} <span class="dim">· recorde ${plural(s.recorde, "dia")} · ${l.total.toLocaleString("pt-BR")} páginas no período</span></div>
        <div class="calor">${cels}</div>`;
    }

    function telaStats() {
      const s = e.stats;
      const meta = s.meta ? `
        <div class="painel">
          <b>${s.lidos} de ${s.meta} livros</b>${s.lidos >= s.meta ? " — meta batida! 🎉" : ` <span class="dim">· faltam ${s.meta - s.lidos}</span>`}
          <div class="meta-trilho"><div style="width:${Math.min(100, (s.lidos * 100) / s.meta)}%"></div></div>
          <button class="btn" data-acao="meta">Mudar a meta<kbd>g</kbd></button>
        </div>` : `<div class="painel dim">Sem meta para ${s.ano}. <button class="btn" data-acao="meta">Definir meta<kbd>g</kbd></button></div>`;
      const maior = Math.max(1, ...s.por_mes);
      const meses = s.por_mes.map((n, i) => `
        <div class="col"><span class="v">${n || ""}</span>
          <div class="bar ${n ? "" : "zero"}" style="height:${(n / maior) * 120}px"></div><small>${MESES[i]}</small></div>`).join("");
      const maiorCat = Math.max(1, ...s.por_categoria.map((c) => c.livros));
      const cats = s.por_categoria.length ? `<ul class="cats">${s.por_categoria.slice(0, 8).map((c) => `
        <li><span>${esc(c.nome)}</span><div class="b" style="width:${(c.livros / maiorCat) * 100}%"></div><span class="dim">${c.livros}</span></li>`).join("")}</ul>`
        : `<div class="dim">Nenhum livro lido com categoria neste ano.</div>`;
      const media = s.nota_media != null ? s.nota_media.toFixed(1).replace(".", ",") + " ★" : "—";
      return `
        <h1>Estatísticas <span class="migalha">›</span>
          <button class="btn" data-ano="${s.ano - 1}">◀</button> ${s.ano} <button class="btn" data-ano="${s.ano + 1}">▶</button></h1>

        <h2>Leitura no último ano</h2>
        <div class="painel">${mapaCalor(s.leitura)}</div>
        <h2>Livros terminados por mês</h2>
        <div class="painel"><div class="meses">${meses}</div></div>
        <h2>Mais lidas por categoria</h2>
        <div class="painel">${cats}</div>`;
    }

    function modal(html, aoAbrir) {
      $("#modal").innerHTML = `<div class="fundo"><div class="modal" role="dialog">${html}</div></div>`;
      const m = $("#modal .modal");
      $("#modal .fundo").addEventListener("mousedown", (ev) => { if (ev.target.classList.contains("fundo")) fecharModal(); });
      m.querySelector("[data-fechar]")?.addEventListener("click", fecharModal);
      aoAbrir?.(m);
      m.querySelector("input, textarea, select, button")?.focus();
    }
    const fecharModal = () => ($("#modal").innerHTML = "");
    const modalAberto = () => !!$("#modal .fundo");

    function confirmar(texto, acao) {
      modal(`<h3>Confirmar</h3><p>${esc(texto)}</p>

        (m) => {

          m.querySelector("#sim").addEventListener("click", sim);
          m.addEventListener("keydown", (ev) => {

    function formPlano() {
      const { livro: b, plano: p } = e.detalhe;
      if (!b.paginas) return avisar("informe o total de páginas (e) antes de criar um plano", true);
      const hoje = new Date().toLocaleDateString("pt-BR");
      const inicial = p ? p.pagina_inicial : b.pagina_atual;
      modal(`
        <h3>Plano de leitura</h3>
        <form id="form-plano">
          <div class="grade2">
            <div><label for="p-inicio">Início (dd/mm/aaaa)</label><input id="p-inicio" value="${esc(p ? p.inicio : hoje)}"></div>
            <div><label for="p-dia">Páginas por dia</label><input id="p-dia" type="number" min="0" value="${p ? p.paginas_dia : ""}"></div>
          </div>
          <div class="dica" id="previa"></div>
          <div class="rodape"><button type="button" class="btn" data-fechar>Cancelar</button><button class="btn prim">Salvar</button></div>
        </form>`, (m) => {
        const previa = () => {
          const n = parseInt(m.querySelector("#p-dia").value || "", 10);
          const [d, mes, a] = m.querySelector("#p-inicio").value.split("/").map(Number);
          const el = m.querySelector("#previa");
          if (n === 0) return (el.textContent = "0 páginas por dia remove o plano");
          if (!n || !a) return (el.textContent = "");
          const restantes = Math.max(0, b.paginas - inicial);
          const dias = Math.max(1, Math.ceil(restantes / n));
          const fim = new Date(a, mes - 1, d + dias - 1).toLocaleDateString("pt-BR");
          el.textContent = `${inicial ? `da pág. ${inicial}: ` : ""}${restantes} páginas a ${n}/dia → termina em ${fim} (${plural(dias, "dia")})`;
        };
        m.addEventListener("input", previa);
        previa();
        m.querySelector("#p-dia").focus();
        m.querySelector("#form-plano").addEventListener("submit", tenta(async (ev) => {
          ev.preventDefault();
          e.detalhe = await api("POST", "/api/plano", {
            livro: b.id, inicio: m.querySelector("#p-inicio").value, paginas_dia: parseInt(m.querySelector("#p-dia").value || "0", 10),
          });
          fecharModal();
          await carregarLivros();
          desenhar();
          avisar(e.detalhe.plano ? `Plano salvo: termina em ${e.detalhe.plano.fim}.` : "Plano removido.");
        }));
      });
    }

    function formMeta() {
      const s = e.stats;
      modal(`
        <h3>Meta de livros para ${s.ano}</h3>
        <form id="form-meta"><input id="m-livros" type="number" min="0" value="${s.meta || ""}" placeholder="0 remove a meta">
          <div class="rodape"><button type="button" class="btn" data-fechar>Cancelar</button><button class="btn prim">Salvar</button></div></form>`, (m) => {
        m.querySelector("#form-meta").addEventListener("submit", tenta(async (ev) => {
          ev.preventDefault();
          await api("POST", "/api/meta", { ano: s.ano, livros: parseInt(m.querySelector("#m-livros").value || "0", 10) });
          fecharModal();
          await abrirStats(s.ano);
          desenhar();
        }));
      });
    }

    const registrarPagina = tenta(async (pagina) => {
      const b = e.detalhe.livro;
      const r = await api("POST", "/api/livro/pagina", { id: b.id, pagina });
      await recarregarDetalhe();
      if (r.chegou_ao_fim) confirmar("Chegou na última página! Marcar como lido?", () => mudarStatus("read"));
      else avisar("Progresso salvo.");
    });
    const mudarStatus = tenta(async (status) => {
      const r = await api("POST", "/api/livro/status", { id: e.detalhe.livro.id, status });
      await recarregarDetalhe();
      const s = statusDe(status);
      if (r.proximo) {
        const p = r.proximo;
        confirmar(`Lido! O próximo da série é ${p.titulo} (vol. ${p.volume}). Abrir?`, () => abrirDetalhe(p.id));
      } else avisar(`Status: ${s.simbolo} ${s.nome}`);
    });
    const emprestar = tenta(async () => {
      const b = e.detalhe.livro;
      if (b.emprestado) {
        return confirmar(`${b.emprestado.pessoa} devolveu o livro?`, async () => {
          e.detalhe = await api("POST", "/api/livro/devolver", { id: b.id });
          await carregarLivros(); desenhar(); avisar("Devolvido.");
        });
      }
      const pessoa = (prompt("Emprestar para quem?") || "").trim();
      if (!pessoa) return;
      e.detalhe = await api("POST", "/api/livro/emprestar", { id: b.id, pessoa });
      await carregarLivros(); desenhar(); avisar(`Emprestado para ${pessoa}.`);
    });
    const avaliar = tenta(async (n) => {
      const b = e.detalhe.livro;
      await api("POST", "/api/livro/avaliar", { id: b.id, nota: n === b.nota ? 0 : n });
      await recarregarDetalhe();
    });
    function removerLivro(id, titulo) {
      confirmar(`Remover “${titulo}” e suas notas?`, async () => {
        await api("POST", "/api/livro/remover", { id });
        e.tela = "biblioteca";
        await carregarLivros();
        desenhar();
        avisar("Livro removido.");
      });
    }
    const recalcular = () => confirmar("Refazer o plano a partir de hoje e da página atual?", async () => {
      e.detalhe = await api("POST", "/api/plano/recalcular", { id: e.detalhe.livro.id });
      desenhar();
      avisar(`Plano recalculado: termina em ${e.detalhe.plano.fim}.`);
    });

    const buscar = tenta(async (q) => {
      e.busca = q.trim();
      if (!e.busca) return;
      e.buscando = true; e.isbnFoto = null; desenhar();
      try { e.resultados = (await api("GET", `/api/buscar?q=${encodeURIComponent(e.busca)}`)).resultados; }
      finally { e.buscando = false; }
      e.buscaSel = 0;
      desenhar();
      if (!e.resultados.length) avisar("Nada encontrado.", true);
    });
    const enviarFoto = tenta(async (arquivo) => {
      avisar("Lendo o código de barras…");
      const r = await api("POST", "/api/foto", arquivo);
      if (!r.isbn) return avisar("Não achei o código de barras de um livro na foto. Tente mais perto, com boa luz e o código reto.", true);
      e.isbnFoto = r.isbn; e.busca = r.isbn; e.resultados = r.resultados; e.buscaSel = 0;
      desenhar();
      if (!r.resultados.length) avisar(`ISBN ${r.isbn} lido, mas nada encontrado.`, true);
    });
    function adicionarResultado(i) {
      const r = e.resultados[i];
      if (!r) return;
      if (r.ja_tenho) return abrirDetalhe(r.ja_tenho);
      formLivro({ titulo: r.titulo, autor: r.autor, isbn: r.isbn, paginas: r.paginas, categorias: r.categorias, status: "shelf" });
    }

    // ── eventos ────────────────────────────────────
    document.addEventListener("click", (ev) => {
      const el = ev.target.closest("[data-menu],[data-aba],[data-cat],[data-livro],[data-acao],[data-status],[data-nota],[data-rm-nota],[data-ano],[data-adicionar],[data-livro-abrir]");
      if (!el) return;
      const d = el.dataset;
      if (d.menu) return irMenu(+d.menu);
      if (d.aba) { e.aba = d.aba; e.sel = 0; return desenhar(); }
      if (d.cat) { e.categoria = e.categoria === d.cat ? null : d.cat; e.sel = 0; return desenhar(); }
      if (d.livro) return abrirDetalhe(+d.livro);
      if (d.livroAbrir) return abrirDetalhe(+d.livroAbrir);
      if (d.status) return mudarStatus(d.status);
      if (d.nota) return avaliar(+d.nota);
      if (d.ano) return tenta(async () => { await abrirStats(+d.ano); desenhar(); })();
      if (d.adicionar) return adicionarResultado(+d.adicionar);
      if (d.rmNota) return confirmar("Remover esta nota?", async () => { await api("POST", "/api/nota/remover", { id: +d.rmNota }); await recarregarDetalhe(); });
      const b = e.detalhe?.livro;
      switch (d.acao) {
        case "novo": return formLivro({ status: e.aba === "todos" ? "shelf" : e.aba });
        case "ir-busca": return irMenu(5);
        case "editar": return formLivro(b);
        case "remover": return removerLivro(b.id, b.titulo);
        case "voltar": return voltar();
        case "plano": return formPlano();
        case "recalcular": return recalcular();
        case "meta": return formMeta();
        case "emprestar": case "devolver": return emprestar();
      }
    });

    document.addEventListener("input", (ev) => {
      if (ev.target.id === "filtro") {
        e.filtro = ev.target.value; e.sel = 0;
        const pos = ev.target.selectionStart;
        desenhar();
        const f = $("#filtro"); f.focus(); f.setSelectionRange(pos, pos);
      }
    });

    document.addEventListener("submit", (ev) => {
      if (ev.target.id === "form-pagina") {
        ev.preventDefault();
        registrarPagina(parseInt($("#pagina").value || "0", 10));
      } else if (ev.target.id === "form-nota") {
        ev.preventDefault();
        tenta(async () => {
          const texto = $("#texto-nota").value;
          const r = await api("POST", "/api/nota", { livro: e.detalhe.livro.id, tipo: $("#tipo-nota").value, texto });
          await recarregarDetalhe();
          avisar(r.nota.tipo === "citacao" ? "Citação salva." : "Nota salva.");
        })();
      } else if (ev.target.id === "form-busca") {
        ev.preventDefault();
        const q = $("#q").value.trim();
        // Enter de novo na mesma busca adiciona o selecionado, como na TUI
        if (q === e.busca && e.resultados.length) adicionarResultado(e.buscaSel);
        else buscar(q);
      }
    });

    document.addEventListener("change", (ev) => {
      if (ev.target.id === "foto" && ev.target.files[0]) enviarFoto(ev.target.files[0]);
    });

    document.addEventListener("keydown", (ev) => {
      if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
      if (modalAberto()) {
        if (ev.key === "Escape") fecharModal();
        return;
      }
      const digitando = ev.target instanceof Element && ev.target.matches("input, textarea, select");
      if (digitando) {
        if (ev.key === "Escape") {
          if (ev.target.id === "filtro" && e.filtro) { e.filtro = ""; desenhar(); }
          ev.target.blur();
        }
        if (e.tela === "busca" && ev.target.id === "q" && (ev.key === "ArrowDown" || ev.key === "ArrowUp")) {
          ev.preventDefault();
          e.buscaSel = Math.max(0, Math.min(e.resultados.length - 1, e.buscaSel + (ev.key === "ArrowDown" ? 1 : -1)));
          const q = $("#q").value; desenhar(); const i = $("#q"); i.focus(); i.value = q;
        }
        return;
      }
      const k = ev.key;
      if (k === "?") return irMenu(6);
      if (e.tela !== "detalhe" && /^[1-7]$/.test(k)) return irMenu(+k - 1);

      if (e.tela === "biblioteca") {
        const lista = visiveis();
        const i = ABAS.indexOf(e.aba);
        if (k === "ArrowDown" || k === "j") { ev.preventDefault(); e.sel = Math.min(lista.length - 1, e.sel + 1); desenhar(); }
        else if (k === "ArrowUp" || k === "k") { ev.preventDefault(); e.sel = Math.max(0, e.sel - 1); desenhar(); }
        else if (k === "ArrowRight" || k === "l") { e.aba = ABAS[(i + 1) % ABAS.length]; e.sel = 0; desenhar(); }
        else if (k === "ArrowLeft" || k === "h") { e.aba = ABAS[(i + ABAS.length - 1) % ABAS.length]; e.sel = 0; desenhar(); }
        else if (k === "Enter" && lista[e.sel]) abrirDetalhe(lista[e.sel].id);
        else if (k === "a") formLivro({ status: e.aba === "todos" ? "shelf" : e.aba });
        else if (k === "e" && lista[e.sel]) formLivro(lista[e.sel]);
        else if (k === "d" && lista[e.sel]) removerLivro(lista[e.sel].id, lista[e.sel].titulo);
        else if (k === "/") { ev.preventDefault(); $("#filtro").focus(); }
        else if (k === "c" && e.categoria) { e.categoria = null; desenhar(); }
        else if (k === "o") irMenu(5);
        else if (k === "Escape") { if (e.filtro || e.categoria) { e.filtro = ""; e.categoria = null; desenhar(); } }
        $("tr.sel")?.scrollIntoView({ block: "nearest" });
      } else if (e.tela === "detalhe") {
        const b = e.detalhe.livro;
        if (k === "Escape" || k === "Backspace") voltar();
        else if (/^[1-5]$/.test(k)) mudarStatus(e.status[+k - 1].chave);
        else if (k === "p") { ev.preventDefault(); $("#pagina").select(); }
        else if (k === "r") { const n = parseInt(prompt("Nota (0 a 5)", b.nota) ?? "", 10); if (n >= 0 && n <= 5) avaliar(n === b.nota ? n : n); }
        else if (k === "n" || k === "c") { ev.preventDefault(); $("#tipo-nota").value = k === "c" ? "citacao" : "nota"; $("#texto-nota").focus(); }
        else if (k === "l") formPlano();
        else if (k === "L" && e.detalhe.plano) recalcular();
        else if (k === "e") formLivro(b);
        else if (k === "m") emprestar();
        else if (k === "d") removerLivro(b.id, b.titulo);
      } else if (e.tela === "stats") {
        if (k === "ArrowLeft" || k === "ArrowRight") tenta(async () => { await abrirStats(e.ano + (k === "ArrowLeft" ? -1 : 1)); desenhar(); })();
        else if (k === "g") formMeta();
      } else if (e.tela === "busca") {
        if (k === "/" || k === "o") { ev.preventDefault(); $("#q").focus(); }
      }
    });

    // ── início ─────────────────────────────────────
    tenta(async () => { await carregarLivros(); await seguirHash(); desenhar(); })();
  </script>
</body>

</html>
